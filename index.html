<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('./static/background.jpg') no-repeat center center/cover;
      color: white;
    }

    .player {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .title { margin-bottom: 15px; font-size: 16px; opacity: 0.9; }

    canvas {
      width: 100%;
      height: 80px;
      margin: 10px 0;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      cursor: pointer;
    }

    .controls button {
      background: white;
      color: black;
      border: none;
      padding: 10px 18px;
      margin: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .controls button:active { transform: scale(0.95); }

    .time { font-size: 12px; opacity: 0.8; margin-top: 5px; }

    .download {
      display: inline-block;
      margin-top: 10px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="player">
    <div class="title">My Audio Track</div>

    <canvas id="wave"></canvas>

    <div class="controls">
      <button id="playBtn">Play</button>
      <button id="stopBtn">Stop</button>
    </div>

    <div class="time" id="time">0:00 / 0:00</div>

    <a class="download" href="./static/audio.mp3" download>Download MP3</a>

    <audio id="audio"></audio>
  </div>

  <script>
    const audio = document.getElementById('audio');

    // Load file from query param (?file=...)
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file') || 'audio.mp3';
    audio.src = `./static/${file}`;
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const canvas = document.getElementById('wave');
    const ctx = canvas.getContext('2d');
    const timeDisplay = document.getElementById('time');

    function resizeCanvas() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    playBtn.onclick = () => audio.play();
    stopBtn.onclick = () => { audio.pause(); audio.currentTime = 0; };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(audio);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;

    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteTimeDomainData(dataArray);

      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      const progressRatio = audio.duration ? audio.currentTime / audio.duration : 0;
      const progressX = progressRatio * canvas.clientWidth;

      let sliceWidth = canvas.clientWidth / bufferLength;
      let x = 0;

      ctx.lineWidth = 2;

      for (let i = 0; i < bufferLength; i++) {
        let v = dataArray[i] / 128.0;
        let y = (v * canvas.clientHeight) / 2;

        ctx.beginPath();
        ctx.moveTo(x, canvas.clientHeight / 2);
        ctx.lineTo(x, y);

        // Progress coloring
        ctx.strokeStyle = x < progressX ? 'white' : 'rgba(255,255,255,0.3)';
        ctx.stroke();

        x += sliceWidth;
      }
    }
    draw();

    // Seek on tap/click
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const ratio = x / rect.width;
      audio.currentTime = ratio * audio.duration;
    });

    audio.addEventListener('timeupdate', () => {
      const format = (t) => {
        const m = Math.floor(t / 60);
        const s = Math.floor(t % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };
      if (audio.duration) {
        timeDisplay.textContent = `${format(audio.currentTime)} / ${format(audio.duration)}`;
      }
    });

    document.body.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }, { once: true });
  </script>
</body>
</html>
